[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sk-sutras-by-shri-shripad-kulkarni"
version = "0.1.0"
description = "A multi-agent LangGraph orchestration system that semantically maps, compares, and synthesizes the Narada Bhakti Sutra and Shandilya Bhakti Sutra into the Udyoga Sutra."
authors = [
    { name = "Hiranyam AI Labs", email = "notifications@hiranyamai.com" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
